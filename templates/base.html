{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}آموزش هوش مصنوعی مکانی{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'dist/main.css' %}">
  <script src="{% static 'dist/htmx.min.js' %}" defer></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
      <a href="{% url 'core:home' %}" class="text-lg font-bold text-emerald-700">آموزش GeoAI</a>
      <nav class="flex items-center gap-4 text-sm">
        {% if user.is_authenticated %}
          <span>{{ user }}</span>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-10">
    {% if messages %}
      <ul class="mb-6 space-y-2">
        {% for message in messages %}
          <li class="rounded-lg bg-emerald-50 px-4 py-3 text-emerald-800">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    lms.araz.me
  </footer>
</body>
</html>
