<a href="{% url 'catalog:course_list' %}" class="hover:text-emerald-700">دوره‌ها</a>
<a href="{% url 'shop:bundle_list' %}" class="hover:text-emerald-700">پکیج‌ها</a>
<a href="{% url 'live:list' %}" class="hover:text-emerald-700">کلاس زنده</a>
{% if user.is_authenticated %}
  <a href="{% url 'catalog:my_courses' %}" class="hover:text-emerald-700">دوره‌های من</a>
  <a href="{% url 'shop:order_list' %}" class="hover:text-emerald-700">سفارش‌ها</a>
  {% if user.is_staff %}<a href="{% url 'admin:index' %}" class="hover:text-emerald-700">پنل مدیریت</a>{% endif %}
  <a href="{% url 'accounts:profile' %}" class="text-slate-500 hover:text-emerald-700">{{ user.get_short_name }}</a>
  <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
    <button class="text-slate-500 hover:text-red-600">خروج</button>
  </form>
{% else %}
  <a href="{% url 'accounts:login' %}" class="w-fit rounded-lg bg-emerald-600 px-4 py-2 font-medium text-white hover:bg-emerald-700">ورود / ثبت‌نام</a>
{% endif %}
