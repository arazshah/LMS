{% load static %}
<a href="{% url 'catalog:course_list' %}" class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white md:text-slate-300">دوره‌ها</a>
<a href="{% url 'live:list' %}" class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white">کلاس‌های زنده</a>
<a href="{% url 'shop:bundle_list' %}" class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white">پکیج‌ها</a>
{% if user.is_authenticated %}
  <a href="{% url 'catalog:my_courses' %}" class="rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-slate-800 hover:text-white">دوره‌های من</a>
  {% if user.is_staff %}<a href="{% url 'admin:index' %}" class="rounded-lg px-3 py-2 text-sm text-emerald-400 hover:bg-slate-800">پنل مدیریت</a>{% endif %}
  <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button class="rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-slate-800 hover:text-white">خروج</button></form>
{% else %}
  <a href="{% url 'accounts:login' %}" class="rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-400">ورود</a>
{% endif %}
