{% extends "base.html" %}
{% load fa %}

{% block title %}پکیج‌ها | {{ site.site_name }}{% endblock %}

{% block content %}
<h1 class="mb-6 text-2xl font-extrabold">پکیج‌های آموزشی</h1>
{% if bundles %}
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {% for bundle in bundles %}{% include "shop/_bundle_card.html" %}{% endfor %}
  </div>
{% else %}
  <p class="rounded-2xl bg-white p-8 text-center text-slate-500 ring-1 ring-slate-200">پکیجی منتشر نشده است.</p>
{% endif %}
{% endblock %}
