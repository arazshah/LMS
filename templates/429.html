{% extends "base.html" %}

{% block title %}تلاش بیش از حد | {{ site.site_name }}{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
  <div class="max-w-md text-center">
    <p class="text-[6rem] font-extrabold leading-none text-slate-100">۴۲۹</p>
    <div class="-mt-6 relative z-10">
      <svg class="mx-auto h-20 w-20 text-amber-500 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    </div>
    <h1 class="mt-4 text-2xl font-extrabold text-slate-900">تعداد تلاش زیاد</h1>
    <p class="mt-2 text-slate-500">تعداد تلاش‌های شما بیش از حد مجاز بود. لطفاً ۱۵ دقیقه دیگر دوباره تلاش کنید.</p>
    <div class="mt-8">
      <a href="{% url 'core:home' %}"
         class="rounded-xl bg-amber-500 px-6 py-2.5 font-bold text-white shadow-lg shadow-amber-500/20 transition hover:bg-amber-400">
        صفحه اصلی
      </a>
    </div>
  </div>
</div>
{% endblock %}
