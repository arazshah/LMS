name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://lms:lms@localhost:5432/lms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install ffmpeg (video transcoding tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t lms:ci .
      - name: Smoke-test the image
        run: >-
          docker run --rm -e DJANGO_SECRET_KEY=ci lms:ci
          python manage.py check --deploy --fail-level ERROR
      - name: Transcode a sample video with the image's ffmpeg
        run: |
          docker run --rm -e DJANGO_SECRET_KEY=ci -e DJANGO_SETTINGS_MODULE=config.settings lms:ci sh -c '
            ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 \
              -f lavfi -i sine -t 4 -c:v libx264 -c:a aac -shortest /tmp/in.mp4 &&
            python -c "
          import django; django.setup()
          from pathlib import Path
          from apps.videos.transcode import transcode
          info, renditions = transcode(Path(\"/tmp/in.mp4\"), Path(\"/tmp/hls\"))
          assert [r.height for r in renditions] == [720, 480], renditions
          assert Path(\"/tmp/hls/master.m3u8\").is_file()
          print(\"transcode ok\", info)
          "'
      - name: Render a Persian PDF with the image's WeasyPrint
        run: >-
          docker run --rm lms:ci python -c
          "from weasyprint import HTML; pdf = HTML(string='<p dir=rtl>فاکتور</p>').write_pdf();
          assert pdf.startswith(b'%PDF'); print('pdf ok', len(pdf))"
